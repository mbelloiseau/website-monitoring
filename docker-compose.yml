volumes:
  prometheus_data:

services:
  prometheus:
    image: "prom/prometheus:latest"
    restart: unless-stopped 
    ports:
      - "127.0.0.1:9090:9090"
    user: nobody
    volumes:
      - "./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./config/prometheus/targets.yml:/etc/prometheus/targets.yml:ro"
      - "./config/prometheus/rules:/etc/prometheus/rules"
      - "prometheus_data:/prometheus"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-admin-api'

  blackbox-exporter:
    image: "prom/blackbox-exporter:latest"
    restart: unless-stopped 
    ports:
      - "127.0.0.1:9115:9115"
    volumes:
      - "./config/blackbox-exporter/blackbox-exporter.yml:/etc/prometheus/blackbox-exporter.yml"
    command:
      - "--config.file=/etc/prometheus/blackbox-exporter.yml"

  grafana:
    image: "grafana/grafana:${GRAFANA_VERSION:-11.5.2}"
    restart: unless-stopped 
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - "GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-CHANGEME}"
      - "GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-true}"
      - "GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/blackbox-exporter.json"
    volumes:
      - "./config/grafana/provisioning:/etc/grafana/provisioning"

